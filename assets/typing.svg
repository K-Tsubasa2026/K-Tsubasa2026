
<svg xmlns="http://www.w3.org/2000/svg"
     width="620" height="60"
     viewBox="0 0 620 60">

  <style>
    .typing {
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #F4A340;
    }

    .line1 {
      opacity: 0;
      animation: show1 9s infinite;
    }

    .line2 {
      opacity: 0;
      animation: show2 9s infinite;
    }

    .line3 {
      opacity: 0;
      animation: show3 9s infinite;
    }

    @keyframes show1 {
      0%, 30% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }

    @keyframes show2 {
      0%, 32% { opacity: 0; }
      33%, 63% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }

    @keyframes show3 {
      0%, 65% { opacity: 0; }
      66%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <text x="310" y="38" text-anchor="middle"
        class="typing line1">
    こんにちは、兼松つばさです！
  </text>

  <text x="310" y="38" text-anchor="middle"
        class="typing line2">
    Welcome to my GitHub!
  </text>

  <text x="310" y="38" text-anchor="middle"
        class="typing line3">
    Frontend × Backend × iOS
  </text>

</svg>
